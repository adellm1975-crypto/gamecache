name: Build GameCache database

on:
  schedule:
    # Every day at 03:00 Moscow time (00:00 UTC)
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - config.ini

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Check private BGG token
        env:
          GAMECACHE_BGG_TOKEN: ${{ secrets.GAMECACHE_BGG_TOKEN }}
        run: |
          if [ -z "$GAMECACHE_BGG_TOKEN" ]; then
            echo "::error::Add GAMECACHE_BGG_TOKEN in repository Actions secrets."
            exit 1
          fi

      - name: Build and publish collection
        env:
          GAMECACHE_GITHUB_TOKEN: ${{ github.token }}
          GAMECACHE_BGG_TOKEN: ${{ secrets.GAMECACHE_BGG_TOKEN }}
        run: python scripts/download_and_index.py --debug
