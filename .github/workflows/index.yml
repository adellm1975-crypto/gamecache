name: Build GameCache database

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - config.ini

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Build and publish public collection
        env:
          GAMECACHE_GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/download_and_index.py --debug
